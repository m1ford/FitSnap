<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator BMi</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: chartreuse;
        }
        .login-card {
            background-color: rgb(43, 184, 24);
            border-radius: 10px;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top bg-success">
        <div class="container">
            <a class="navbar-brand text-white" href="#">Welcome</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="btn btn-secondary" href="login.html" style="width: 100px;">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Konten Utama -->
    <div class="container my-5">
        <div class="row justify-content-center">
            
            <!-- FORM INPUT DATA -->
            <div class="col-md-4 mb-4">
                <div class="login-card p-4 shadow">
                    <h3 class="text-center mb-4 text-white">Kalkulator BMI</h3>

                    <form id="formLogin">
                        <div class="mb-3">
                            <label for="nama" class="form-label text-white">Nama Lengkap</label>
                            <input type="text" id="nama" class="form-control" placeholder="Masukkan Nama Anda" required>
                        </div>

                        <div class="mb-3">
                            <label for="tinggi" class="form-label text-white">Tinggi Badan</label>
                            <input type="text" id="tinggi" class="form-control" placeholder="Masukkan Tinggi (cm)" required>
                        </div>

                        <div class="mb-4">
                            <label for="berat" class="form-label text-white">Berat Badan</label>
                            <input type="text" id="berat" class="form-control" placeholder="Masukkan Berat (kg)" required>
                        </div>

                        <div class="d-flex justify-content-center">
                            <button type="submit" class="btn shadow btn-light text-success fw-bold px-4">Hitung BMI</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- TABEL RIWAYAT (TANPA FOTO) -->
            <div class="col-md-8">
                <div class="card p-4 shadow-sm bg-white rounded">
                    <h4 class="mb-3 text-dark text-center">Riwayat Perhitungan BMI</h4>
                    <div class="table-responsive">
                        <table class="table table-bordered table-striped text-center align-middle mb-0">
                            <thead class="table-success">
                                <tr>
                                    <th>No</th>
                                    <th>Nama</th>
                                    <th>Tinggi</th>
                                    <th>Berat</th>
                                    <th>Skor BMI</th>
                                    <th>Kategori</th>
                                </tr>
                            </thead>
                            <tbody id="tempatTabel">
                                <tr id="barisKosong">
                                    <td colspan="6" class="text-muted">Belum ada data perhitungan.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/user.js"></script>
</body>
</html>
